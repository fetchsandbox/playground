# Create the app at https://api.slack.com/apps → "From a manifest".
# Replace API_BASE with the `SlackRequestUrlBase` stack output (…/slack).
display_information:
  name: customer-ops
  description: Parallel AI agents for quotes, billing, research, surveys and handoffs
features:
  bot_user:
    display_name: customer-ops
    always_online: true
  slash_commands:
    - command: /ops
      url: API_BASE/commands
      description: Run the customer-ops agents on a request
      usage_hint: quote 20 Pro seats + onboarding for dana@acme.com, check billing, send a survey
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
settings:
  event_subscriptions:
    request_url: API_BASE/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: API_BASE/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
